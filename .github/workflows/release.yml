name: Release Desktop Binaries (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Desktop Application & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Pomodoro App v__VERSION__'
          releaseBody: |
            ## Pomodoro Desktop Release v__VERSION__

            ### What's New in v__VERSION__:
            - **Ambient Sounds (Blanket Mode):** Built-in zero-CPU ambient noise mixer powered by Web Audio API. Play and mix soothing sounds (Rain, Storm & Thunder, Wind, Ocean Waves, Fireplace, Forest Birds, Coffee Shop, White & Deep Brown Noise) with individual volume sliders and quick presets (`B` shortcut).
            - **Focus Session Sync:** Option to automatically play ambient sounds only during active focus intervals and auto-pause on breaks.
            - **Tactile Chronometer UI:** Hardware-inspired matte finish with a 60-tick precision SVG dial and status telemetry.
            - **Light & Dark Themes:** Warm carbon dark mode and tactile paper light mode (`T` shortcut).
            - **Cross-Platform Support:** Ready-to-use binaries for both Linux and Windows!

            ### Downloads:
            - **Windows (`.exe`):** `Pomodoro_*_x64-setup.exe` (or standalone MSI installer).
            - **Linux AppImage:** Universal standalone binary for Fedora, Ubuntu, Arch, Debian, Mint.
            - **Linux DEB:** Native package for Debian, Ubuntu, Linux Mint.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
