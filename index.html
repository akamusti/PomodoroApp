<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Top Utility Bar -->
      <header class="topbar">
        <div class="status-cluster">
          <span class="status-led" id="statusLed"></span>
          <span class="status-label" id="statusLabel">STANDBY</span>
        </div>

        <div class="toolbar">
          <button id="quickSoundBtn" class="tool-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">
            <svg id="soundOnIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="soundOffIcon" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <button id="ambientBtn" class="tool-btn" title="Ambient Sounds (Blanket) [B]" aria-label="Ambient Sounds">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 11v2"></path>
            </svg>
            <span id="ambientActiveDot" class="ambient-active-indicator hidden"></span>
          </button>

          <button id="themeBtn" class="tool-btn" title="Switch Theme (T)" aria-label="Switch Theme">
            <svg id="sunIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg id="moonIcon" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <button id="settingsBtn" class="tool-btn" title="Preferences" aria-label="Preferences">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14"></line>
              <line x1="4" y1="10" x2="4" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="3"></line>
              <line x1="20" y1="21" x2="20" y2="16"></line>
              <line x1="20" y1="12" x2="20" y2="3"></line>
              <line x1="1" y1="14" x2="7" y2="14"></line>
              <line x1="9" y1="8" x2="15" y2="8"></line>
              <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Segmented Mode Selector -->
      <nav class="segmented-control" role="tablist" aria-label="Timer Mode">
        <button class="segment active" data-mode="work" role="tab">
          <span class="segment-dot"></span>
          <span>Focus</span>
        </button>
        <button class="segment" data-mode="shortBreak" role="tab">
          <span class="segment-dot"></span>
          <span>Short Break</span>
        </button>
        <button class="segment" data-mode="longBreak" role="tab">
          <span class="segment-dot"></span>
          <span>Long Break</span>
        </button>
      </nav>

      <!-- Main Chronometer Instrument -->
      <main class="instrument-panel">
        <div class="dial-wrapper">
          <svg class="dial-svg" viewBox="0 0 260 260" aria-hidden="true">
            <!-- 60 Precision Tick Marks populated by JS -->
            <g id="dialTicks" class="dial-ticks"></g>
            <!-- Subtle inner guide ring -->
            <circle class="dial-track" cx="130" cy="130" r="106" />
            <circle class="dial-progress" id="progressCircle" cx="130" cy="130" r="106" />
          </svg>

          <div class="readout">
            <span class="mode-tag" id="modeBadge">FOCUS SESSION</span>
            <div class="time-digits" id="timeDisplay">25:00</div>
            <input
              type="text"
              id="taskInput"
              class="task-input"
              placeholder="Add focus note..."
              maxlength="36"
              spellcheck="false"
              autocomplete="off"
            />
          </div>
        </div>

        <!-- Telemetry / Session Bar -->
        <div class="telemetry-bar">
          <div class="telemetry-header">
            <span class="telemetry-label" id="cycleText">SESSION 01 / 04</span>
            <span class="telemetry-stat" id="todayStat">TODAY 0M</span>
          </div>
          <div class="segment-bars" id="cycleDots"></div>
        </div>
      </main>

      <!-- Hardware-style Control Deck -->
      <footer class="control-deck">
        <button id="resetBtn" class="deck-btn secondary" title="Reset Timer (R)" aria-label="Reset">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>

        <button id="startBtn" class="deck-btn primary" title="Start / Pause (Space)" aria-label="Start or Pause">
          <svg id="playIcon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
          <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
          <span id="startBtnText">START</span>
          <kbd class="key-hint">SPACE</kbd>
        </button>

        <button id="skipBtn" class="deck-btn secondary" title="Next Phase (S)" aria-label="Skip Phase">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
      </footer>

      <!-- Preferences Sheet -->
      <div id="settingsModal" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-panel">
          <div class="sheet-header">
            <h3 id="sheetTitle">Preferences</h3>
            <button id="closeSettingsBtn" class="sheet-close" aria-label="Close">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <div class="sheet-body">
            <div class="section-caption">DURATIONS (MINUTES)</div>

            <div class="setting-row">
              <label for="workDuration">Focus Session</label>
              <div class="stepper">
                <button type="button" class="step-btn" data-target="workDuration" data-step="-5">&minus;</button>
                <input type="number" id="workDuration" min="1" max="120" value="25" />
                <button type="button" class="step-btn" data-target="workDuration" data-step="5">+</button>
              </div>
            </div>

            <div class="setting-row">
              <label for="shortBreakDuration">Short Break</label>
              <div class="stepper">
                <button type="button" class="step-btn" data-target="shortBreakDuration" data-step="-1">&minus;</button>
                <input type="number" id="shortBreakDuration" min="1" max="60" value="5" />
                <button type="button" class="step-btn" data-target="shortBreakDuration" data-step="1">+</button>
              </div>
            </div>

            <div class="setting-row">
              <label for="longBreakDuration">Long Break</label>
              <div class="stepper">
                <button type="button" class="step-btn" data-target="longBreakDuration" data-step="-5">&minus;</button>
                <input type="number" id="longBreakDuration" min="1" max="90" value="15" />
                <button type="button" class="step-btn" data-target="longBreakDuration" data-step="5">+</button>
              </div>
            </div>

            <div class="setting-row">
              <label for="longBreakInterval">Cycles Before Long Break</label>
              <div class="stepper">
                <button type="button" class="step-btn" data-target="longBreakInterval" data-step="-1">&minus;</button>
                <input type="number" id="longBreakInterval" min="1" max="12" value="4" />
                <button type="button" class="step-btn" data-target="longBreakInterval" data-step="1">+</button>
              </div>
            </div>

            <div class="section-caption">BEHAVIOR &amp; ALERTS</div>

            <label class="switch-row" for="soundToggle">
              <span>Acoustic Chime</span>
              <input type="checkbox" id="soundToggle" class="sr-only" checked />
              <span class="switch-ui"></span>
            </label>

            <label class="switch-row" for="notifToggle">
              <span>System Notifications</span>
              <input type="checkbox" id="notifToggle" class="sr-only" checked />
              <span class="switch-ui"></span>
            </label>

            <label class="switch-row" for="autoStartBreaks">
              <span>Auto-start Breaks</span>
              <input type="checkbox" id="autoStartBreaks" class="sr-only" />
              <span class="switch-ui"></span>
            </label>
          </div>

          <div class="sheet-footer">
            <button id="saveSettingsBtn" class="btn-apply">Apply Changes</button>
          </div>
        </div>
      </div>

      <!-- Ambient Sounds Sheet (Blanket Mode) -->
      <div id="ambientModal" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ambientSheetTitle">
        <div class="sheet-panel ambient-panel">
          <div class="sheet-header">
            <div class="ambient-header-title">
              <h3 id="ambientSheetTitle">Ambient Sounds</h3>
              <span class="ambient-pill-badge">BLANKET</span>
            </div>
            <div class="ambient-header-actions">
              <button id="ambientMasterMuteBtn" class="ambient-icon-btn" title="Mute/Unmute All" aria-label="Toggle Mute">
                <svg id="ambientMuteOffIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="ambientMuteOnIcon" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <line x1="23" y1="9" x2="17" y2="15"></line>
                  <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
              </button>
              <button id="closeAmbientBtn" class="sheet-close" aria-label="Close">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="sheet-body ambient-sheet-body">
            <!-- Master Control & Focus Sync -->
            <div class="ambient-card ambient-master-card">
              <div class="ambient-slider-head">
                <span class="ambient-card-label">Master Volume</span>
                <span id="ambientMasterVolVal" class="ambient-vol-readout">70%</span>
              </div>
              <input type="range" id="ambientMasterSlider" min="0" max="100" value="70" class="ambient-range master-range" />

              <label class="switch-row compact-switch" for="ambientSyncToggle">
                <span class="switch-text-group">
                  <span class="switch-text-main">Sync with Focus Session</span>
                  <span class="switch-text-sub">Plays only when timer is running; pauses on breaks</span>
                </span>
                <input type="checkbox" id="ambientSyncToggle" class="sr-only" />
                <span class="switch-ui"></span>
              </label>
            </div>

            <!-- Quick Presets -->
            <div class="section-caption">QUICK PRESETS</div>
            <div class="ambient-presets">
              <button class="preset-pill" data-preset="rainy-night">🌧️ Rainy Night</button>
              <button class="preset-pill" data-preset="cozy-fireplace">🔥 Cozy Fire</button>
              <button class="preset-pill" data-preset="deep-focus">🎧 Deep Focus</button>
              <button class="preset-pill" data-preset="peaceful-nature">🌲 Nature</button>
              <button class="preset-pill reset" data-preset="clear-all">Mute All</button>
            </div>

            <!-- Sound Mixer List -->
            <div class="section-caption">SOUND MIXER</div>
            <div class="ambient-tracks-list" id="ambientTracksContainer"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
