<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="brand">
          <span class="brand-icon">🍅</span>
          <span class="brand-name">Pomodoro</span>
        </div>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <!-- Mode Selector -->
      <nav class="mode-nav">
        <button class="mode-tab active" data-mode="work">Focus</button>
        <button class="mode-tab" data-mode="shortBreak">Short Break</button>
        <button class="mode-tab" data-mode="longBreak">Long Break</button>
      </nav>

      <!-- Timer Ring Section -->
      <main class="timer-section">
        <div class="progress-ring-container">
          <svg class="progress-ring" viewBox="0 0 300 300">
            <circle class="ring-track" cx="150" cy="150" r="130" />
            <circle class="ring-progress" id="progressCircle" cx="150" cy="150" r="130" />
          </svg>
          <div class="timer-content">
            <div class="time-display" id="timeDisplay">25:00</div>
            <div class="mode-badge" id="modeBadge">Focus Time</div>
          </div>
        </div>

        <!-- Cycle Tracker -->
        <div class="cycle-tracker">
          <span class="cycle-text" id="cycleText">Cycle 1 of 4</span>
          <div class="cycle-dots" id="cycleDots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>

        <!-- Controls -->
        <div class="timer-controls">
          <button id="resetBtn" class="control-btn secondary" title="Reset Session" aria-label="Reset">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
          
          <button id="startBtn" class="control-btn primary" title="Start Timer" aria-label="Start">
            <svg id="playIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>

          <button id="skipBtn" class="control-btn secondary" title="Skip Session" aria-label="Skip">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>
        </div>
      </main>

      <!-- Settings Modal -->
      <div id="settingsModal" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header">
            <h3>Timer Settings</h3>
            <button id="closeSettingsBtn" class="close-btn" aria-label="Close settings">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label for="workDuration">Focus Time (minutes)</label>
              <input type="number" id="workDuration" min="1" max="90" value="25" />
            </div>
            <div class="form-group">
              <label for="shortBreakDuration">Short Break (minutes)</label>
              <input type="number" id="shortBreakDuration" min="1" max="30" value="5" />
            </div>
            <div class="form-group">
              <label for="longBreakDuration">Long Break (minutes)</label>
              <input type="number" id="longBreakDuration" min="1" max="60" value="15" />
            </div>
            <div class="form-group">
              <label for="longBreakInterval">Long Break Interval (cycles)</label>
              <input type="number" id="longBreakInterval" min="1" max="10" value="4" />
            </div>
            <hr class="divider" />
            <div class="toggle-group">
              <label for="soundToggle">Sound Notifications</label>
              <input type="checkbox" id="soundToggle" checked />
            </div>
            <div class="toggle-group">
              <label for="notifToggle">Desktop Notifications</label>
              <input type="checkbox" id="notifToggle" checked />
            </div>
            <div class="toggle-group">
              <label for="autoStartBreaks">Auto-start Breaks</label>
              <input type="checkbox" id="autoStartBreaks" />
            </div>
          </div>
          <div class="modal-footer">
            <button id="saveSettingsBtn" class="btn-save">Save Changes</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
